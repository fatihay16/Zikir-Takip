
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Kalıcı imza anahtarını hazırla
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/zikir-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$HOME/.android/zikir-release.jks" >> "$GITHUB_ENV"

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Web dosyalarını hazırla
        run: npm run build:web

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Capacitor eklentilerini eşitle
        run: npx cap sync android

      - name: APK imza ayarlarını yap
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          marker = "    buildTypes {"
          signing = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
          if "signingConfigs {" not in s:
              if marker not in s:
                  raise SystemExit("Gradle imza bölümü bulunamadı")
              s = s.replace(marker, signing + marker, 1)
          build_types = s.find(marker)
          if build_types < 0:
              raise SystemExit("buildTypes bölümü bulunamadı")
          target = "        release {"
          release_pos = s.find(target, build_types)
          if release_pos < 0:
              raise SystemExit("buildTypes içindeki release yapılandırması bulunamadı")
          release_end = s.find("\\n        }", release_pos)
          if release_end < 0:
              raise SystemExit("Release yapılandırmasının sonu bulunamadı")
          release_block = s[release_pos:release_end]
          if "signingConfig signingConfigs.release" not in release_block:
              s = s[:release_pos] + release_block.replace(
                  target, target + "\\n            signingConfig signingConfigs.release", 1
              ) + s[release_end:]
          p.write_text(s)
          PY

      - name: İmzalı APK oluştur
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: APK dosyasını paylaş
        uses: actions/upload-artifact@v4
        with:
          name: gunluk-zikir-takip-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
